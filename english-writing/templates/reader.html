<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 范文收录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#173b78;--coral:#ff655d;--sky:#45c7e9;--sun:#ffd43b;--leaf:#49bd68;--cream:#fff4d8;--white:#fffaf0;--ink:#17345f;--muted:#6d6a61}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 4px 0 rgba(23,59,120,.35)}
.title-area{flex:1;min-width:0}
.article-title{font-size:18px;font-weight:800;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.article-meta{font-size:12px;color:rgba(255,244,216,.75);margin-top:2px}
.controls{display:flex;gap:10px;align-items:center;flex-shrink:0}
.btn{padding:8px 18px;border-radius:9px 12px 8px 11px;border:2px solid var(--navy);font-size:14px;cursor:pointer;transition:all .15s;font-weight:700;background:var(--white);color:var(--navy)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--navy)}
.btn-primary{background:var(--navy);color:var(--cream);border-color:var(--navy);box-shadow:3px 3px 0 var(--sun)}
.btn-primary:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--coral);background:var(--navy)}
.reading-view{display:flex;gap:24px;padding:24px;max-width:1100px;margin:0 auto}
.article-area{flex:1;min-width:0;background:var(--white);border:2.5px solid var(--navy);border-radius:20px 26px 18px 23px;padding:28px 36px;box-shadow:7px 8px 0 rgba(23,59,120,.8);font-family:Georgia,'Times New Roman',serif}
.article-area h2{font-size:22px;font-weight:700;margin:24px 0 14px;color:#1a1a2e;font-family:-apple-system,sans-serif}
.article-area p{font-size:17px;line-height:1.85;margin-bottom:18px;color:#2d3748}
.article-area blockquote{border-left:3px solid #4263eb;padding-left:16px;margin:18px 0;color:#5a6577;font-style:italic}
.word-bank-panel{width:300px;flex-shrink:0;display:flex;flex-direction:column}
.word-bank-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--sun);border-radius:14px 18px 0 0;border:2.5px solid var(--navy);border-bottom:none}
.word-bank-header h2{font-size:15px;font-weight:600;color:#344054;display:flex;align-items:center;gap:6px}
.word-count-badge{background:var(--navy);color:var(--cream);font-size:12px;font-weight:800;padding:2px 9px;border-radius:8px 11px 7px 10px}
.word-list-wrap{background:var(--white);border:2.5px solid var(--navy);border-radius:0 0 14px 18px 16px 20px;overflow-y:auto;max-height:calc(100vh - 180px);padding:12px}
.word-list{display:flex;flex-direction:column;gap:8px}
.word-card{background:var(--cream);border-radius:10px 13px 9px 12px;padding:10px 12px;position:relative;border:2px dashed rgba(23,59,120,.35);transition:all .15s;animation:cardIn .3s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.word-text{font-weight:600;font-size:14px;color:#1a1a2e;font-family:Georgia,serif}
.word-translation{font-size:13px;color:#5a6577;margin-top:3px}
.word-context{font-size:12px;color:#8b95a5;margin-top:5px;font-style:italic;line-height:1.4}
.word-remove{position:absolute;top:6px;right:6px;width:22px;height:22px;border:none;background:none;cursor:pointer;color:#bbb;font-size:18px;line-height:1;border-radius:4px;transition:all .15s}
.word-remove:hover{color:#e03131;background:#fee}
.empty-hint{color:#8b95a5;font-size:13px;padding:20px 8px;text-align:center;line-height:1.6}
.word-highlight{background:#fef3c7;border-radius:3px;padding:1px 2px;transition:background .2s;cursor:pointer}
.word-highlight:hover{background:#fde68a}
.tooltip{display:none;position:fixed;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:1000;max-width:320px;transition:opacity .1s}
.tooltip-original{font-size:12px;color:#8b95a5;margin-bottom:3px;font-family:Georgia,serif;border-bottom:1px dashed #e5e7eb;padding-bottom:6px}
.tooltip-translation{font-size:15px;font-weight:500;color:#1a1a2e}
.tooltip-hint{font-size:11px;color:#2f9e44;margin-top:6px;font-weight:500}
@media(max-width:900px){.reading-view{flex-direction:column;padding:16px}.word-bank-panel{width:100%}.word-list-wrap{max-height:300px}.article-area{padding:20px 24px}}
</style>
</head>
<body>
<header class="top-bar">
  <div class="title-area">
    <h1 class="article-title"></h1>
    <span class="article-meta"></span>
  </div>
  <div class="controls">
    <button class="btn" id="lib-btn">素材库</button>
    <button class="btn btn-primary" id="import-lib-btn">导入素材库</button>
  </div>
</header>
<main class="reading-view">
  <article class="article-area" id="article-area"></article>
  <aside class="word-bank-panel">
    <div class="word-bank-header"><h2>单词本</h2><span class="word-count-badge" id="word-count">0</span></div>
    <div class="word-list-wrap"><div class="word-list" id="word-list"></div></div>
  </aside>
</main>
<div class="tooltip" id="tooltip"></div>
<script>
const READER_DATA = {{READER_DATA_JSON}};
const STORAGE_KEY = 'english_collect_' + READER_DATA.id;
// 旧键迁移（ielts_collect_ → english_collect_）：已有单词本数据不丢
try{
  const LEGACY_KEY = 'ielts_collect_' + READER_DATA.id;
  if(!localStorage.getItem(STORAGE_KEY) && localStorage.getItem(LEGACY_KEY)){
    localStorage.setItem(STORAGE_KEY, localStorage.getItem(LEGACY_KEY));
  }
}catch(e){}
let wordBank = [];
const $article = document.getElementById('article-area');
const $wordList = document.getElementById('word-list');
const $wordCount = document.getElementById('word-count');
const $tooltip = document.getElementById('tooltip');
const $title = document.querySelector('.article-title');
const $meta = document.querySelector('.article-meta');

function init(){
  document.title = '收录: ' + READER_DATA.title;
  $title.textContent = READER_DATA.title;
  const metaParts = [READER_DATA.source].filter(Boolean);
  if (metaParts.length) $meta.textContent = metaParts.join(' · ');
  loadWordBank(); renderArticle(); renderWordBank(); bindEvents();
}
function renderArticle(){
  var html = READER_DATA.content;
  if (!wordBank.length){ $article.innerHTML = html; return; }
  var words = wordBank.slice().sort((a,b)=>b.text.length-a.text.length);
  words.forEach(function(w){
    var escaped = w.text.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    var regex = new RegExp('\\b('+escaped+')\\b','gi');
    html = html.replace(regex,'<span class="word-highlight" data-word="'+w.text.toLowerCase()+'">$1</span>');
  });
  $article.innerHTML = html;
}
function bindEvents(){
  document.addEventListener('mouseup', handleSelection);
  $article.addEventListener('click', function(e){
    var span = e.target.closest('.word-highlight');
    if(!span) return;
    var entry = wordBank.find(w=>w.text.toLowerCase()===span.dataset.word);
    if(entry) showTooltip(e, entry.text, entry.translation, true);
  });
  document.addEventListener('mousedown', e=>{ if(!$tooltip.contains(e.target)) $tooltip.style.display='none'; });
  document.getElementById('lib-btn').addEventListener('click', function(){ window.open('./my-library.html','_blank'); });

  // 导入素材库：汇总所有阅读页的划词词本（file:// 页面共享 localStorage），
  // 下载 writing-wordbank-export.txt（word/释义/原句 三列）。落盘即导入意图，
  // agent 下次对话自动拾取入库（懒导入），无需再对口令。
  // 保存位置由用户在浏览器对话框里选 ~/Desktop/English Learning/（页面无法指定文件夹）。
  function flashBtn(btn, msg){
    const old = btn.textContent;
    btn.textContent = msg;
    setTimeout(function(){ btn.textContent = old; }, 3000);
  }
  document.getElementById('import-lib-btn').addEventListener('click', function(){
    const byWord = {};
    try{
      for(let i=0;i<localStorage.length;i++){
        const key = localStorage.key(i);
        const m = key && key.match(/^(?:english|ielts)_collect_(.+)$/);
        if(!m) continue;
        let words;
        try{ words = JSON.parse(localStorage.getItem(key)); }catch(e){ continue; }
        if(!Array.isArray(words)) continue;
        words.forEach(function(w){
          if(!w || !w.text || !w.translation || w.translation === '（待翻译）') return;
          const k = 'e' + w.text.toLowerCase();
          if(!byWord[k]) byWord[k] = [w.text, w.translation, w.context || ''];
        });
      }
    }catch(e){}
    const rows = Object.values(byWord);
    if(!rows.length){ flashBtn(this, '还没有可导入的划词'); return; }
    const blob = new Blob([rows.map(function(r){ return r.join('\t'); }).join('\n')], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'writing-wordbank-export.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
    try{ navigator.clipboard.writeText(rows.map(function(r){ return r[0]; }).join(', ')).catch(function(){}); }catch(e){}
    flashBtn(this, '✓ 已提交 · 下次对话自动入库');
  });
}
function handleSelection(e){
  if(e.target.closest('.word-bank-panel,.tooltip,.top-bar')) return;
  const sel = window.getSelection();
  const text = sel.toString().trim();
  if(!text) return;
  const ctx = getSelectionContext(sel);
  const dictResult = dictLookup(text);
  if(dictResult){ showTooltip(e,text,dictResult,true); addToWordBank(text,dictResult,ctx); }
  else {
    showTooltip(e,text,'…翻译中',false);
    translateAPI(text).then(t=>{ showTooltip(e,text,t,true); addToWordBank(text,t,ctx); })
      .catch(()=>{ showTooltip(e,text,'⚠ 网络不可用',false); addToWordBank(text,'（待翻译）',ctx); });
  }
}
function dictLookup(text){
  const lower=text.toLowerCase().trim(); const dict=READER_DATA.dictionary;
  if(dict[text]) return dict[text];
  if(dict[lower]) return dict[lower];
  const clean=lower.replace(/[.,!?;:'"()\[\]{}]/g,'');
  if(dict[clean]) return dict[clean];
  const stems=[clean.replace(/s$/,''),clean.replace(/es$/,''),clean.replace(/ed$/,''),clean.replace(/ing$/,''),clean.replace(/ly$/,''),clean.replace(/er$/,''),clean.replace(/est$/,'')];
  for(const s of stems){ if(dict[s]) return dict[s]; }
  return null;
}
function translateAPI(text){
  return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|zh-CN')
    .then(r=>r.json()).then(d=>d.responseData.translatedText)
    .catch(()=>fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(text)).then(r=>r.json()).then(d=>d[0].map(x=>x[0]).join('')));
}
function getSelectionContext(sel){
  if(!sel.rangeCount) return '';
  try{
    const range=sel.getRangeAt(0);
    const container=range.commonAncestorContainer;
    var fullText = container.nodeType===3 ? container.parentElement.textContent : (container.textContent||range.toString());
    var selectedText=sel.toString().trim();
    if(!selectedText||!fullText) return selectedText.substring(0,300);
    var pos=fullText.toLowerCase().indexOf(selectedText.toLowerCase());
    if(pos===-1) return selectedText.substring(0,300);
    var start=pos;
    for(var i=pos-1;i>=0;i--){ if(fullText[i]==='.'||fullText[i]==='!'||fullText[i]==='?'){start=i+1;break;} start=i; }
    var end=pos+selectedText.length;
    for(var j=end;j<fullText.length;j++){ if(fullText[j]==='.'||fullText[j]==='!'||fullText[j]==='?'){end=j+1;break;} }
    return fullText.substring(start,end).trim().substring(0,300);
  }catch{ return ''; }
}
function showTooltip(e,original,translation,added){
  $tooltip.innerHTML='<div class="tooltip-original">'+esc(original)+'</div><div class="tooltip-translation">'+esc(translation)+'</div>'+(added?'<div class="tooltip-hint">✓ 已添加到单词本</div>':'');
  $tooltip.style.display='block'; $tooltip.style.left='0px'; $tooltip.style.top='0px';
  requestAnimationFrame(()=>{
    const r=$tooltip.getBoundingClientRect();
    let x=e.clientX+12,y=e.clientY-r.height-12;
    if(x+r.width>window.innerWidth-10) x=window.innerWidth-r.width-10;
    if(y<10) y=e.clientY+24; if(x<10) x=10;
    $tooltip.style.left=x+'px'; $tooltip.style.top=y+'px';
  });
}
function loadWordBank(){ try{ const s=localStorage.getItem(STORAGE_KEY); if(s) wordBank=JSON.parse(s); }catch{ wordBank=[]; } }
function saveWordBank(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(wordBank)); }catch(e){} }
function addToWordBank(text,translation,context){
  const exist=wordBank.find(w=>w.text.toLowerCase()===text.toLowerCase());
  if(exist){ if(exist.translation==='（待翻译）'&&translation!=='（待翻译）'){ exist.translation=translation; saveWordBank(); renderWordBank(); } return; }
  wordBank.push({text,translation,context:(context||'').substring(0,200),ts:Date.now()});
  saveWordBank(); renderWordBank(); renderArticle();
}
function renderWordBank(){
  $wordCount.textContent=wordBank.length;
  if(!wordBank.length){ $wordList.innerHTML='<p class="empty-hint">用鼠标划出想积累的词或词组<br>翻译会自动出现在这里</p>'; return; }
  $wordList.innerHTML=wordBank.map((w,i)=>
    '<div class="word-card"><div class="word-text">'+esc(w.text)+'</div><div class="word-translation">'+esc(w.translation)+'</div>'+
    (w.context?'<div class="word-context">'+esc(w.context)+'</div>':'')+
    '<button class="word-remove" data-idx="'+i+'">×</button></div>').join('');
  $wordList.querySelectorAll('.word-remove').forEach(b=>b.addEventListener('click',e=>{
    wordBank.splice(parseInt(e.currentTarget.dataset.idx),1); saveWordBank(); renderWordBank(); renderArticle();
  }));
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
init();
</script>
</body>
</html>
